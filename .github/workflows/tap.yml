name: Homebrew tap

# After a release is published, point lostcoords/homebrew-tap at it. The key is a deploy key that
# can write to the tap and nothing else. Run it by hand to redo a release's formula.
on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, such as v0.9.1
        required: true

permissions:
  contents: read

jobs:
  tap:
    # Releases only: a tag push that succeeded, and no prerelease tags such as v1.0.0-rc.1.
    if: >-
      github.event_name == 'workflow_dispatch' || (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        startsWith(github.event.workflow_run.head_branch, 'v') &&
        !contains(github.event.workflow_run.head_branch, '-'))
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ inputs.tag || github.event.workflow_run.head_branch }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: lostcoords/homebrew-tap
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          path: tap
      - run: scripts/update-tap "$TAG" tap/Formula/parcela.rb
      - name: Commit and push
        working-directory: tap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            git push --dry-run origin HEAD
            exit 0
          fi
          git commit -am "parcela ${TAG#v}"
          git push origin HEAD
