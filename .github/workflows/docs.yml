name: Documentation

on:
  pull_request:
    paths:
      - 'CONTRIBUTING.md'
      - 'docs/**'
      - '.agents/skills/parcela/SKILL.md'
      - 'examples/docs-demo/**'
      - 'assets/brand/logo.png'
      - 'scripts/dashboard/**'
      - 'src/dashboard/index.html'
      - 'src/dashboard/ui.css'
      - '.github/workflows/docs.yml'
  push:
    branches: [main]
    paths:
      - 'CONTRIBUTING.md'
      - 'docs/**'
      - '.agents/skills/parcela/SKILL.md'
      - 'examples/docs-demo/**'
      - 'assets/brand/logo.png'
      - 'scripts/dashboard/**'
      - 'src/dashboard/index.html'
      - 'src/dashboard/ui.css'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: site-${{ github.ref }}
      cancel-in-progress: false
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: '4.0'
          bundler-cache: true
          working-directory: docs
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - run: npm ci
      - run: bin/rails test
      - run: npm test
      # Kiln writes target/docs and checks every link, anchor and importmap module; cards.mjs
      # then draws the social cards. wrangler.jsonc serves target/docs at parcela.run.
      - run: bin/rails kiln:build
        env:
          RAILS_ENV: production
      - run: npm run cards
      - name: Deploy to Cloudflare
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx --yes wrangler@4.94.0 deploy
