name: Rust checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install jj and Caddy
        run: scripts/ci-tools
      - run: scripts/check
      - name: Live suites against real Caddy
        # docs-example runs the docs' `python3 -m http.server`, which waits on a reverse DNS
        # lookup that intermittently takes 35s on GitHub's macOS runners.
        run: scripts/check-live ${{ matrix.os == 'macos-latest' && 'core service-sets ports recovery upgrades' || '' }}
        env:
          # The upgrades suite lists earlier releases through the GitHub API.
          GITHUB_TOKEN: ${{ github.token }}
      - name: Logs from the failed live fixtures
        if: failure()
        run: |
          for root in /tmp/pcl-live-*; do
            find "$root" -name '*.log' -size +0 | head -20 | while read -r log; do
              echo "== $log"; tail -40 "$log"
            done
          done
