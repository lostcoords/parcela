<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Parcela</title>
<link rel="icon" href="/_parcela/badge.png">
<link rel="stylesheet" href="/ui.css">
<script src="/app.js" defer></script>
</head>
<body class="bg-background text-foreground">
<div class="mx-auto min-w-0 w-full lc-container-page max-w-page py-8">
  <div class="flex min-w-0 flex-col gap-section">
    <header class="flex min-w-0 flex-wrap items-center justify-between gap-4">
      <div class="flex min-w-0 flex-wrap items-center gap-3">
        <img src="/_parcela/badge.png" alt="" width="30" height="27">
        <h1 class="lc-heading m-0 text-foreground text-heading lc-trim">Environments</h1>
        <span id="summary"></span>
</div>      <div class="w-full sm:w-72"><input type="search" class="w-full max-w-full min-w-0 px-3 font-sans text-base bg-(--lc-field-bg,var(--input)) text-foreground placeholder:text-muted-foreground border border-transparent rounded-xl lc-squircle outline-none transition-[border-color,box-shadow] duration-(--lc-motion-quick) ease-(--lc-ease-out) focus:shadow-[0_0_0_calc(var(--spacing)*0.5)_var(--ring,color-mix(in_oklab,var(--primary)_50%,transparent))] aria-invalid:border-destructive aria-invalid:shadow-[0_0_0_3px_color-mix(in_oklab,var(--destructive)_16%,transparent)] h-control-md" data-slot="input" id="filter" placeholder="Filter" autocomplete="off" aria-label="Filter environments"></div>
</header>    <p class="lc-text m-0 text-small text-muted-foreground" id="health" role="status" aria-live="polite">Connecting to Parcela…</p>
    <div id="environments" class="grid gap-section"></div>
    <details id="stopped" class="group" hidden>
      <summary class="flex cursor-pointer list-none items-center gap-2 rounded text-small font-semibold text-muted-foreground hover:text-foreground [&::-webkit-details-marker]:hidden">
        <span class="transition-transform group-open:rotate-90"><svg fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" xmlns="http://www.w3.org/2000/svg" class="lc-icon size-4" data-slot="icon" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="m8.25 4.5 7.5 7.5-7.5 7.5"/></svg></span>
        <span id="stopped-count"></span>
      </summary>
      <div id="stopped-list" class="mt-6 grid gap-section"></div>
    </details>
</div></div>
<template id="project"><section class="grid min-w-0 gap-related" data-slot="list-section"><h2 class="m-0 px-content text-label font-semibold text-muted-foreground sm:px-inset" data-slot="list-heading">Project</h2><ul class="m-0 grid min-w-0 list-none gap-0.5 p-0" data-slot="list-group"></ul></section></template>
<template id="row">
  <li class="flex min-h-16 min-w-0 items-center gap-heading px-content py-heading text-start sm:px-inset lc-list-row bg-card text-card-foreground first:rounded-t-3xl last:rounded-b-3xl lc-squircle max-sm:flex-wrap max-sm:[&amp;&gt;[data-slot=list-text]]:basis-full" data-slot="list-row"><span class="grid min-w-0 flex-1 gap-0.5" data-slot="list-text"><span class="font-semibold" data-slot="list-title">Name</span><span class="text-small text-muted-foreground [overflow-wrap:anywhere]" data-slot="list-subtitle">URL</span></span>
    <div class="flex shrink-0 flex-wrap items-center justify-end gap-1 max-sm:justify-start" data-slot="controls"></div>
</li></template>
<template id="problem"><span class="text-small text-destructive [overflow-wrap:anywhere]"></span></template>
<template id="note"><span class="text-small text-warning"></span></template>
<template id="empty"><p class="lc-text m-0 text-body text-muted-foreground"></p></template>
  <template id="badge-neutral"><span class="inline-flex items-center gap-tight rounded-lg lc-squircle px-2 py-0.5 font-sans text-caption font-medium whitespace-nowrap bg-tile text-muted-foreground" data-slot="badge" data-tone="neutral">state</span></template>
  <template id="badge-success"><span class="inline-flex items-center gap-tight rounded-lg lc-squircle px-2 py-0.5 font-sans text-caption font-medium whitespace-nowrap bg-success-soft text-success" data-slot="badge" data-tone="success">state</span></template>
  <template id="badge-warning"><span class="inline-flex items-center gap-tight rounded-lg lc-squircle px-2 py-0.5 font-sans text-caption font-medium whitespace-nowrap bg-warning-soft text-warning" data-slot="badge" data-tone="warning">state</span></template>
  <template id="badge-destructive"><span class="inline-flex items-center gap-tight rounded-lg lc-squircle px-2 py-0.5 font-sans text-caption font-medium whitespace-nowrap bg-destructive-soft text-destructive" data-slot="badge" data-tone="destructive">state</span></template>
<template id="open"><a class="lc-press inline-grid place-items-center shrink-0 border-0 bg-transparent text-muted-foreground cursor-pointer no-underline transition-[background-color,color,transform,scale] duration-(--lc-motion-quick) ease-(--lc-ease-out) not-disabled:hover:text-(--lc-button-ink,var(--foreground)) not-disabled:hover:bg-[color-mix(in_oklab,var(--lc-button-bg,var(--secondary))_94%,var(--lc-button-ink,var(--foreground)))] not-disabled:active:bg-[color-mix(in_oklab,var(--lc-button-bg,var(--secondary))_94%,var(--lc-button-ink,var(--foreground)))] disabled:cursor-not-allowed disabled:shadow-none disabled:[--lc-button-bg:color-mix(in_oklab,var(--foreground)_10%,transparent)] disabled:text-[color-mix(in_oklab,var(--foreground)_38%,transparent)] [&amp;_svg]:block [&amp;_svg]:shrink-0 rounded-xl lc-squircle size-control-sm [&amp;_svg]:size-4" aria-label="Open" data-slot="icon-button" data-size="sm" target="_blank" rel="noopener" href="#"><svg fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" xmlns="http://www.w3.org/2000/svg" class="lc-icon" data-slot="icon" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M13.5 6H5.25A2.25 2.25 0 0 0 3 8.25v10.5A2.25 2.25 0 0 0 5.25 21h10.5A2.25 2.25 0 0 0 18 18.75V10.5m-10.5 6L21 3m0 0h-5.25M21 3v5.25"/></svg></a></template>
<template id="open-service"><a class="inline-flex items-center justify-center gap-related rounded-pill font-sans whitespace-nowrap no-underline cursor-pointer transition-[background-color,border-color,color,box-shadow,transform,translate,scale,filter] duration-(--lc-motion-control) ease-(--lc-ease-out) motion-safe:not-disabled:hover:-translate-y-px motion-safe:not-disabled:active:translate-y-px active:shadow-none disabled:cursor-not-allowed disabled:shadow-none disabled:[--lc-button-bg:color-mix(in_oklab,var(--foreground)_10%,transparent)] disabled:text-[color-mix(in_oklab,var(--foreground)_38%,transparent)] [&amp;_svg]:block [&amp;_svg:not([class*=&#39;size-&#39;])]:size-[1.1em] [&amp;_svg]:shrink-0 h-control-sm px-3 has-[&gt;[data-icon=inline-start]]:ps-2.5 has-[&gt;[data-icon=inline-end]]:pe-2.5 border border-border bg-transparent text-(--lc-button-ink,var(--foreground)) not-disabled:hover:bg-[color-mix(in_oklab,var(--lc-button-bg,var(--secondary))_94%,var(--lc-button-ink,var(--foreground)))] not-disabled:active:bg-[color-mix(in_oklab,var(--lc-button-bg,var(--secondary))_94%,var(--lc-button-ink,var(--foreground)))] text-small" data-slot="button" data-variant="outline" data-size="sm" target="_blank" rel="noopener" href="#"><span data-slot="service">service</span></a></template>

<template id="start"><button type="button" class="lc-press inline-grid place-items-center shrink-0 border-0 bg-transparent cursor-pointer no-underline transition-[background-color,color,transform,scale] duration-(--lc-motion-quick) ease-(--lc-ease-out) not-disabled:hover:text-(--lc-button-ink,var(--foreground)) not-disabled:hover:bg-[color-mix(in_oklab,var(--lc-button-bg,var(--secondary))_94%,var(--lc-button-ink,var(--foreground)))] not-disabled:active:bg-[color-mix(in_oklab,var(--lc-button-bg,var(--secondary))_94%,var(--lc-button-ink,var(--foreground)))] disabled:cursor-not-allowed disabled:shadow-none disabled:[--lc-button-bg:color-mix(in_oklab,var(--foreground)_10%,transparent)] disabled:text-[color-mix(in_oklab,var(--foreground)_38%,transparent)] [&amp;_svg]:block [&amp;_svg]:shrink-0 rounded-xl lc-squircle size-control-sm [&amp;_svg]:size-4 text-(--parcela-brand)" aria-label="Start" data-slot="icon-button" data-size="sm"><svg fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" xmlns="http://www.w3.org/2000/svg" class="lc-icon" data-slot="icon" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M5.25 5.653c0-.856.917-1.398 1.667-.986l11.54 6.347a1.125 1.125 0 0 1 0 1.972l-11.54 6.347a1.125 1.125 0 0 1-1.667-.986V5.653Z"/></svg></button></template>
<template id="restart"><button type="button" class="lc-press inline-grid place-items-center shrink-0 border-0 bg-transparent text-muted-foreground cursor-pointer no-underline transition-[background-color,color,transform,scale] duration-(--lc-motion-quick) ease-(--lc-ease-out) not-disabled:hover:text-(--lc-button-ink,var(--foreground)) not-disabled:hover:bg-[color-mix(in_oklab,var(--lc-button-bg,var(--secondary))_94%,var(--lc-button-ink,var(--foreground)))] not-disabled:active:bg-[color-mix(in_oklab,var(--lc-button-bg,var(--secondary))_94%,var(--lc-button-ink,var(--foreground)))] disabled:cursor-not-allowed disabled:shadow-none disabled:[--lc-button-bg:color-mix(in_oklab,var(--foreground)_10%,transparent)] disabled:text-[color-mix(in_oklab,var(--foreground)_38%,transparent)] [&amp;_svg]:block [&amp;_svg]:shrink-0 rounded-xl lc-squircle size-control-sm [&amp;_svg]:size-4" aria-label="Restart" data-slot="icon-button" data-size="sm"><svg fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" xmlns="http://www.w3.org/2000/svg" class="lc-icon" data-slot="icon" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0 3.181 3.183a8.25 8.25 0 0 0 13.803-3.7M4.031 9.865a8.25 8.25 0 0 1 13.803-3.7l3.181 3.182m0-4.991v4.99"/></svg></button></template>
<template id="stop"><button type="button" class="lc-press inline-grid place-items-center shrink-0 border-0 bg-transparent text-muted-foreground cursor-pointer no-underline transition-[background-color,color,transform,scale] duration-(--lc-motion-quick) ease-(--lc-ease-out) not-disabled:hover:text-(--lc-button-ink,var(--foreground)) not-disabled:hover:bg-[color-mix(in_oklab,var(--lc-button-bg,var(--secondary))_94%,var(--lc-button-ink,var(--foreground)))] not-disabled:active:bg-[color-mix(in_oklab,var(--lc-button-bg,var(--secondary))_94%,var(--lc-button-ink,var(--foreground)))] disabled:cursor-not-allowed disabled:shadow-none disabled:[--lc-button-bg:color-mix(in_oklab,var(--foreground)_10%,transparent)] disabled:text-[color-mix(in_oklab,var(--foreground)_38%,transparent)] [&amp;_svg]:block [&amp;_svg]:shrink-0 rounded-xl lc-squircle size-control-sm [&amp;_svg]:size-4" aria-label="Stop" data-slot="icon-button" data-size="sm"><svg fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" xmlns="http://www.w3.org/2000/svg" class="lc-icon" data-slot="icon" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M5.25 7.5A2.25 2.25 0 0 1 7.5 5.25h9a2.25 2.25 0 0 1 2.25 2.25v9a2.25 2.25 0 0 1-2.25 2.25h-9a2.25 2.25 0 0 1-2.25-2.25v-9Z"/></svg></button></template>
</body>
</html>
