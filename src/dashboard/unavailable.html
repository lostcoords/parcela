<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Parcela</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:24px;background:#101114;color:#ecece8;font:14px/1.45 system-ui,-apple-system,sans-serif}
main{width:min(380px,100%);padding:24px;border-radius:16px;background:#17181b;box-shadow:0 0 0 1px #ffffff1a}
img{display:block;width:32px;height:auto;margin-bottom:16px}
small{display:block;color:#9a9ca3;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
h1{margin:2px 0 10px;font-size:20px;font-weight:650;overflow-wrap:anywhere}
p{display:flex;align-items:center;gap:8px;margin:0 0 20px;color:#9a9ca3;overflow-wrap:anywhere}
i{flex:none;width:8px;height:8px;border-radius:50%;background:#5c5e64}
i.busy{background:#dda35a}
i.failed{background:#ef7f68}
nav{display:flex;align-items:center;flex-wrap:wrap;gap:14px}
button{padding:7px 14px;border:0;border-radius:8px;background:#ecece8;color:#17181b;font:inherit;font-weight:600;cursor:pointer}
button:hover{background:#fff}
button:disabled{opacity:.5;cursor:default}
a{color:#9a9ca3;font-size:13px}
a:hover{color:#ecece8}
:focus-visible{outline:2px solid #ecece8;outline-offset:2px}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
<img src="/_parcela/badge.png" alt="">
<small id="project" hidden></small>
<h1 id="name">Environment unavailable</h1>
<p role="status"><i id="dot"></i><span id="status">Checking…</span></p>
<nav>
<button id="action" type="button" hidden></button>
<a id="logs" href="/_parcela/#logs" hidden>Logs</a>
<a id="all" href="#">All environments</a>
</nav>
</main>
<script src="/_parcela/unavailable.js"></script>
</body>
</html>
