[workspace]
members = ["cargo:."]

[dist]
cargo-dist-version = "0.33.0"
ci = "github"
installers = ["shell"]
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]
install-path = "~/.local/bin"
install-updater = false
github-build-setup = "../release-notices.yml"
auto-includes = false
include = ["LICENSE", "COPYRIGHT", "target/notices/THIRD_PARTY_NOTICES.txt"]
checksum = "sha256"
unix-archive = ".tar.gz"

# GitHub retired the macos-14 image dist picks by default.
[dist.github-custom-runners]
aarch64-apple-darwin = "macos-15"
x86_64-apple-darwin = "macos-15"
