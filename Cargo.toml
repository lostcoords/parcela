[package]
name = "parcela"
version = "0.9.2"
edition = "2024"
rust-version = "1.89"
description = "Deployable dev environments for your AI agents"
license = "AGPL-3.0-only"
repository = "https://github.com/lostcoords/parcela"
homepage = "https://github.com/lostcoords/parcela"
publish = false
readme = "README.md"
include = ["build.rs", "src/**", ".agents/skills/parcela/SKILL.md", "Cargo.lock", "LICENSE", "COPYRIGHT", "/README.md"]

[package.metadata.dist]
dist = true

[dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive", "env"] }
libc = "0.2"
rusqlite = { version = "0.42", features = ["bundled", "backup"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
semver = "1.0"
signal-hook = "0.4"
sha2 = "0.11"
serde-saphyr = { version = "2.1", default-features = false, features = ["deserialize"] }
uuid = { version = "1.24", features = ["v4", "serde"] }
tempfile = "3.27"
clap_complete = "4.6"

[dev-dependencies]
schemars = "1.2"

[profile.dist]
inherits = "release"
lto = "thin"

[profile.dev]
debug = 0
incremental = false
