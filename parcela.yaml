# yaml-language-server: $schema=https://parcela.run/schema/v1.json
# Runs this repository's documentation site, so every worktree previews its own docs.
version: 1
project: parcela

services:
  docs:
    working_dir: docs/website
    command: bin/rails server -p $PORT -b 127.0.0.1
    http:
      healthcheck: /
  # Kiln has no watcher of its own; tailwindcss-rails rebuilds the CSS.
  css:
    working_dir: docs/website
    command: bin/rails tailwindcss:watch[always]

hooks:
  setup:
    command: cd docs/website && (bundle check || bundle install) && npm ci
  prestart:
    command: cd docs/website && bin/rails tailwindcss:build
